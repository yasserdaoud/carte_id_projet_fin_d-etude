name: id_card_example
description: Demonstrates how to use the mrzscanner_flutter plugin.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=2.17.0 <=4.0.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.0.1
  archive: ^3.1.2
  collection: ^1.16.0
  convert: ^3.0.0
  crypto: ^3.0.1
  expandable: ^5.0.1
  fixnum: ^1.0.0
  flutter_nfc_kit: ^3.3.1
  logging: ^1.0.1
  meta: ^1.3.0
  tripledes_nullsafety: ^1.0.3
  pointycastle: ^3.7.3
  intl: ^0.19.0
  google_mlkit_text_recognition: ^0.4.0
  camera: ^0.10.0+4
  google_mlkit_commons: ^0.2.0
  camera_platform_interface: ^2.2.2
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  local_auth:
  sqflite:
  shared_preferences:
  showcaseview:
  path_provider:
  cupertino_icons: ^1.0.2
  iconly: ^1.0.1
  flutter_bloc: ^8.1.3
  go_router: ^6.0.0
  nfc_host_card_emulation:

  smooth_page_indicator: ^1.1.0
  curved_navigation_bar: ^1.0.3
  google_nav_bar: ^5.0.6
  line_icons: ^2.0.3
  lottie: ^3.1.0
  liquid_pull_to_refresh: ^3.0.1

  flutter_svg: ^2.0.10+1
  share_plus: ^9.0.0
  url_launcher: ^6.2.6

  image_picker:
  nfc_manager:
  badges: ^3.1.2
  android_intent_plus: ^2.0.2

  water_drop_nav_bar:
  flutter_staggered_animations: ^1.1.1
  jdenticon_dart: ^2.0.0
  rflutter_alert: ^2.0.2
  web3dart: any

  confetti: any
  qr_code_scanner: any
  nice_buttons: ^0.0.3
  enhance_stepper:
  walletconnect_flutter_v2: ^2.2.3
  http:
  cryptography:
  percent_indicator: ^4.2.3
  firebase_core:
  cloud_firestore:

  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^4.2.1


    # mrzscanner_flutter:
    # When depending on this package from a real application you should use:
    #   mrzscanner_flutter: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    # path: lib/mrz_lib

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  
dev_dependencies:
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_logo.png"

  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/app_banner.jpg
    - assets/face.png
    - assets/back1.png
    - assets/front.png
    - assets/back.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

